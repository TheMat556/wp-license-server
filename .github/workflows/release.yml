name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── PHP ────────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: sodium, mbstring, mysqli
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-prod-${{ hashFiles('composer.lock') }}
          restore-keys: composer-prod-

      - name: Install Composer dependencies (production only)
        run: composer install --no-dev --optimize-autoloader

      # ── Node / JS ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # ── Package ────────────────────────────────────────────────────────
      - name: Create release ZIP
        run: |
          RELEASE_DIR="${{ runner.temp }}/release/wp-license-server"
          mkdir -p "$RELEASE_DIR"
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.env.example' \
            --exclude='.prettierrc' \
            --exclude='.opencode/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='.phpunit.cache/' \
            --exclude='eslint.config.mjs' \
            --exclude='tsconfig.json' \
            --exclude='vite.config.ts' \
            --exclude='phpstan.neon' \
            --exclude='phpunit.xml' \
            --exclude='composer.lock' \
            --exclude='package-lock.json' \
            --exclude='bun.lock' \
            --exclude='coverage.xml' \
            --exclude='coverage-html/' \
            --exclude='test-results.xml' \
            --exclude='app/Admin/assets/' \
            --exclude='graphify-out/' \
            . "$RELEASE_DIR"
          cd "${{ runner.temp }}/release"
          zip -r "${{ github.workspace }}/wp-license-server.zip" wp-license-server/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-license-server
          path: wp-license-server.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wp-license-server.zip
          generate_release_notes: true
